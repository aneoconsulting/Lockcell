name: Code Integration

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Check linting, formatting and typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "lockcell/.python-version"

      - name: Linting
        run: cd lockcell && uv run ruff check ..

      - name: Formatting
        run: cd lockcell && uv run ruff format ..

      - name: Check Diff
        run: |
          DIFF="$(git diff --name-only)"

          if [ -z "$DIFF" ]; then
            echo "OK: Format is clean"
          else
            echo "Error: Format was not clean"
            echo "List of files:"
            echo "$DIFF"
            git diff
            exit 1
          fi
  
  testing:
    name: Test Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
            repository: aneoconsulting/ArmoniK
            path: infra

      - id: deploy
        name: Deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@main
        with:
            working-directory: ${{ github.workspace }}/infra
            type: localhost
            log-suffix: ${{ matrix.demo }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Forcing the python version because in the current Armonik repository, in parameters.tfvars, the version of the pymonik worker is 3.10.12.
          # The worker crash if versions aren't compatible
          python-version: "3.10.12"
         
      - name: Run Demo Client
        timeout-minutes: 10
        run: |
         export CPIP=$(kubectl get svc control-plane -n armonik -o custom-columns="IP:.spec.clusterIP" --no-headers=true)
         export CPPort=$(kubectl get svc control-plane -n armonik -o custom-columns="PORT:.spec.ports[*].port" --no-headers=true)
         export Grpc__Endpoint=$CPIP:$CPPort
         cd lockcell
         sed -i 's/requires-python = ">=3.11"/requires-python = ">=3.10"/' pyproject.toml
         uv run --python=$(which python) pytest